# parameters_B_markovian.yaml — Config B: Full bath with Markovian vibronic filter at L=3
# All 189 modes in GW_SYSBATH:
#   - 21 DL modes (3×7 sites): full depth up to L=3
#   - 168 vibronic modes (12 modes × 2 exponentials × 7 sites): Markovian filter → depth 0/1 only
# Hierarchy init: C(192,3) = 1.16M aux vectors → after Markovian filter: ~2200 aux vecs.
# Memory: ~0.1 GB/traj.
# Reference: Full Kleinekathöfer/Coker bath, vibronic modes at Markovian depth.

metadata:
  project: "Quantum_Agrivoltaic_PT-HOPS"
  version: "1.0"
  description: "Config B — L=3, full bath + Markovian filter on 168 vibronic modes."

hamiltonian:
  sites: 7
  coupling_type: "FMO_Realistic"
  source: "Adolphs_Renger_2006"

bath:
  spectral_density: "Kleinekathoefer_Coker_Multi-Mode"
  temperature: 295.0
  reorganization_energy: 35.0     # cm^-1 (Drude-Lorentz)
  drude_cutoff: 50.0              # cm^-1
  vibronic_frequencies: [180.0, 220.0, 280.0, 350.0, 520.0, 575.0, 720.0, 1050.0, 1185.0, 1220.0, 1350.0, 1500.0]
  huang_rhys_factors: [0.05, 0.045, 0.03, 0.025, 0.02, 0.015, 0.01, 0.008, 0.005, 0.005, 0.004, 0.003]
  vibronic_damping: [10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0]

dynamics:
  L_max: 3                         # L=3: sufficient for DL + vibronic with Markovian filter
  matsubara_truncation: 2
  time_max: 1000.0
  time_step: 1.0
  convergence_threshold: 1.0e-6
  sbd_bundles_per_site: 6
  vibronic_in_hierarchy: true      # ← KEY: vibronic modes IN GW_SYSBATH
  vibronic_markovian: true         # ← KEY: Markovian filter on vibronic modes

simulation:
  n_traj: 100
  n_traj_temp_sweep: 10
  n_disorder_samples: 100
  disorder_sigma_cm: 50.0

pulse:
  type: "Gaussian"
  fwhm: 50.0
  delay: 0.0
  center_freq: 12500.0
  amplitude: 0.05
  phase: 0.0

spectral_filter:
  type: "dual_band_gaussian"
  band_centers_nm: [750.0, 820.0]
  bandwidth_cm: 100.0
  weights: [1.0, 1.0]

agrivoltaics:
  coupling_strength: 0.03
  opv_bandgap: 1.9
  n_opv_sites: 4
  regions: ["Germany", "India", "Kenya"]

visualization:
  theme: "JPCL_Standard"
  dpi: 600
  font_size_min: 10
  contrast_high: true
  save_format: "pdf"
