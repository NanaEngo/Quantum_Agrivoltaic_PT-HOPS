# server_production.yaml — Production run for JPCL revision (Session 3c)
# L=8, SBD bundles=3 (21 modes → C(29,8)=4.3M states), 100 traj
metadata:
  project: "Quantum_Agrivoltaic_PT-HOPS"
  version: "1.0.0"
  description: "FMO Light-Harvesting Simulation — JPCL Production (SBD bundles=3)"

hamiltonian:
  sites: 7
  coupling_type: "FMO_Realistic"
  source: "Adolphs_Renger_2006"

bath:
  spectral_density: "Kleinekathoefer_Coker_Multi-Mode"
  temperature: 295.0
  reorganization_energy: 35.0
  drude_cutoff: 50.0
  vibronic_frequencies: [180.0, 220.0, 280.0, 350.0, 520.0, 575.0, 720.0, 1050.0, 1185.0, 1220.0, 1350.0, 1500.0]
  huang_rhys_factors: [0.05, 0.045, 0.03, 0.025, 0.02, 0.015, 0.01, 0.008, 0.005, 0.005, 0.004, 0.003]
  vibronic_damping: [10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0]

dynamics:
  L_max: 8
  matsubara_truncation: 2
  time_max: 1000.0
  time_step: 0.5
  convergence_threshold: 1.0e-4
  sbd_bundles_per_site: 3

simulation:
  n_traj: 100
  n_traj_temp_sweep: 100
  n_disorder_samples: 100
  disorder_sigma_cm: 50.0

pulse:
  type: "Gaussian"
  fwhm: 50.0
  delay: 0.0
  center_freq: 12500.0
  amplitude: 0.05
  phase: 0.0

spectral_filter:
  type: "dual_band_gaussian"
  band_centers_nm: [750.0, 820.0]
  bandwidth_cm: 100.0
