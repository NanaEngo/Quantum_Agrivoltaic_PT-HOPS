# parameters.yaml - Configuration file for Quantum Agrivoltaics Paper 2
# Unified parameters for microclimate, quantum solver, LCA, and security.

simulation:
  temperature_k: 295.0
  solar_flux_threshold: 450.0  # W/m2 for NPQ trigger (realistic daily average)

quantum:
  solver:
    hierarchy_depth: 8       # L=8 for production convergence (Paper 1 standard)
    time_step_fs: 0.2        # dt=0.2 fs to resolve auxiliary decay timescale
    simulation_duration_fs: 1000.0  # total simulation window (fs) — production
    n_traj: 2
    sbd_bundles_per_site: 3  # SBD compression bundles (Paper 1 standard)
  fmo:
    sites: 8
    coupling_reaction_center: 0.15  # Gamma_RC in ps-1
    mode_volume_nm3: 0.8
  floquet:
    driving_amplitude: 0.05
    driving_frequency: 1.2
  sers:
    optomechanical_coupling: 0.01
  npom:
    enabled: false

microclimate:
  greenhouse:
    shading_factor: 0.35
    soiling_factor: 0.05
    crop_coefficient: 0.85
  default_temp_c: 25.0
  default_rh_pct: 60.0
  default_wind_speed_m_s: 0.5
  baseline_water_mm: 5.0

lca:
  cooperative:
    coop_members: 5
    capex_subsidy_rate: 0.30          # 30% blended-finance subsidy on CAPEX
    area_m2: 500.0                     # V5: micro-module (down from 10000 m2)
    crop_price_per_kg: 4.5            # USD/kg — strawberry/flower export (vs 0.8 for tomato)
    yield_kg_per_m2_yr: 8.2           # High-value floriculture yield
    discount_rate: 0.12               # Risk-adjusted rate for Sub-Saharan Africa
    annual_training_opex_usd: 1200.0  # Extension services & technician training
    annual_cleaning_opex_usd: 800.0   # OPV panel washing (water + labour)
  carbon:
    grid_intensity_gco2_kwh: 450.0
  pv_efficiency: 0.15
  pv_fill_factor: 0.8
  reference_biomass_kg: 12.0
  default_capex: 161000.0            # V5: 322 USD/m2 × 500 m2
  capex_std: 16100.0
  default_annual_revenue: 30612.0    # 30 USD/m2/yr × 500 m2 (electricity + water + floriculture + carbon credits, see SI Sec S5)
  revenue_std: 3061.0
  default_annual_opex: 2000.0
  panel_cleaning_annual_cost: 800.0  # Aligned with cooperative.annual_cleaning_opex_usd
  scenario_b_yield_factor: 0.8
  scenario_b_water_factor: 0.9
  scenario_b_power_factor: 1.1
  scenario_b_biomass_kg: 10.0
  scenario_c_yield_factor: 0.7
  scenario_c_water_liters: 0.0
  scenario_c_power_kwh: 0.0
  scenario_c_biomass_kg: 12.0

output:
  dynamics_h5: data/converged/production_dynamics.h5
  graphics_dir: Graphics

security:
  qkd:
    channel_type: "fiber"              # V5: buried single-mode fibre (no free-space)
    channel_noise_rate: 0.048          # V5: realistic QBER base rate 4.8%
    security_threshold: 0.11           # Shor-Preskill unconditional security limit
    key_length_bits: 256

digital_twin:
  update_interval_seconds: 60           # Data fusion refresh interval (Axe 1)
  sync_opv_grid: true                   # Synchronize OPV power output with grid telemetry

quantum_signal:
  kernel_gamma: 0.5                     # Quantum kernel RBF width
  kernel_regularization: 0.001          # Tikhonov regularisation for kernel ridge
  mps_chi: 16                           # MPS bond dimension for spectral denoising
  mps_sweeps: 5                         # DMRG sweeps (reserved, not used in v1)
  stress_anomaly_zscore: 2.0            # Z-score threshold for stress alarm
  noise_sigma_fraction: 0.05            # Injected noise fraction for synthetic telemetry

physics:
  soiling_decay_rate_per_day: 0.005   # OPV efficiency loss per day of dust/dropping accumulation
  sensing_sentinel_ratio: 0.01        # Fraction of canopy with active NPoM (1%)
  npom_optimal_mode_volume_nm3: 1.2   # V=1.2 nm3 optimal from volume scan
