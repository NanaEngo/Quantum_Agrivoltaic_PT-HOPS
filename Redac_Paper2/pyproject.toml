[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "quantum-agrivoltaics-paper2"
version = "1.0.0"
description = "Quantum Agrivoltaics Paper 2 — Coordinated Vibronic Light-Harvesting & Polaritonic Interface"
requires-python = ">=3.12"
authors = [
    { name = "Taamangtchu & Antigravity" },
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "h5py>=3.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "mesohops>=1.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 60

[project.urls]
"Repository" = "https://github.com/Taamangtchu/Quantum_Agrivoltaic_PT-HOPS"
