provenance:
  framework_version: 2.5.0
  target_journal: Renewable Energy (Elsevier)
  date: '2026-11-12'
  quantum_solver: 'Partial-Secular + Pauli Modified Redfield-Forster NESS (benchmark:
    MesoHOPS v1.8.0 HopsTensorTrajectory)'
lhcii_hamiltonian:
  complex_model: LHCII_monomer_14_sites
  site_count: 14
  chla_sites: 8
  chlb_sites: 6
  primary_hamiltonian: Novoderezhkin_Marin_vanGrondelle_2011
  sensitivity_hamiltonian: Muh_Madjet_Renger_2010_and_MMSIC_MD_2025
  hamiltonian_source: data/wp1/lhcii_hamiltonians_14site.json
  dipole_geometry_pdb: data/wp1/lhcii_pdb_dipoles.json
  ness_master_equation_modes:
  - partial_secular_redfield_forster
  - pauli_secular_rate_limit
  rc_npq_closure_enabled: true
  redfield_forster_coupling_cutoff_cm1: 15.0
  drude_lorentz_lambda_cm1: 50.87
  drude_lorentz_gamma_cm1: 50.0
  renger_bath_parameters:
    S: 0.65
    s1: 0.8
    s2: 0.5
    omega1_cm1: 0.5565
    omega2_cm1: 1.936
    E_lambda_cm1: 50.87
  full_vibrational_modes_count: 48
  temperature_kelvin: 295.0
  static_disorder_fwhm_cm1: 110.0
  n_disorder_realizations: 200
  mesohops_validation_benchmark:
    enabled_for_error_bound_only: true
    purpose: Lightweight non-Markovian error-bound verification; NOT brute-force 48-mode
      steady-state production
    reduced_bath_modes_count: 2
    resonant_mode_frequencies_cm1:
    - 340.0
    - 740.0
    hierarchy_depth_L: 6
    matsubara_modes_K: 2
    time_step_fs: 1.0
    total_time_fs: 1000.0
    tensor_mps_svd_threshold: 1.0e-06
    n_trajectories_benchmark: 32
ness_solar_pumping:
  illumination_regime: Continuous-wave incoherent solar blackbody + AM1.5G
  solar_temperature_kelvin: 5778.0
  pumping_rate_scale_s1: 10.0
  rc_trapping_rate_ps1: 0.005
  terminal_cluster_exit_sensitivity_ps1:
  - 0.0033
  - 0.5
  nonradiative_decay_ns1: 0.25
